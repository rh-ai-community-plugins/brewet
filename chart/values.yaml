# Default values for brewet.
# This is a YAML-formatted file.

image:
  repository: quay.io/OWNER/brewet
  tag: ""
  pullPolicy: IfNotPresent

# Overrides .Chart.Name so deployed resources use the plugin name, not the
# chart name (which has a -chart suffix to avoid OCI registry collisions).
nameOverride: "brewet"
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

replicaCount: 1

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /brewet
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

securityContext:
  runAsNonRoot: true

nodeSelector: {}

tolerations: []

affinity: {}

# BFF (Backend For Frontend) service
bff:
  enabled: true
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  image:
    repository: quay.io/OWNER/brewet-bff
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Optional reference NetworkPolicy — restricts per-project storage backend
# ingress to the BFF namespace only. Deploy to each project namespace.
networkPolicy:
  enabled: false

# Storage backend image — used by the frontend when creating per-project containers.
# The tag should match the deployed plugin version.
storageBackend:
  image:
    repository: quay.io/OWNER/brewet-storage-backend
    tag: ""
    pullPolicy: IfNotPresent
