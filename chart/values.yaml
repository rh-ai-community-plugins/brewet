# Default values for brewet.
# This is a YAML-formatted file.

image:
  # -- Container image registry and repository.
  # Format: <registry>/<org>/<image> (e.g. quay.io/my-org/brewet).
  repository: quay.io/rh-ai-community-plugins/brewet
  # -- Image tag override. When empty (""), defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# -- Overrides .Chart.Name so deployed resources use the plugin name, not the
# chart name (which has a -chart suffix to avoid OCI registry collisions).
# Must be a valid DNS label: lowercase alphanumeric or '-', start/end with
# alphanumeric, max 63 characters (RFC 1123).
nameOverride: "brewet"
# -- Fully overrides the generated resource name prefix.
# Must be a valid DNS label: lowercase alphanumeric or '-', start/end with
# alphanumeric, max 63 characters (RFC 1123). Leave empty to use the default.
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# -- Number of frontend pod replicas. Must be a positive integer (>= 1).
replicaCount: 1

service:
  type: ClusterIP
  # -- Service port exposed to the cluster. Valid range: 1-65535.
  port: 8080
  # -- Container port the service forwards to. Valid range: 1-65535.
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /brewet
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

securityContext:
  runAsNonRoot: true

nodeSelector: {}

tolerations: []

affinity: {}

# BFF (Backend For Frontend) service
bff:
  enabled: true
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  image:
    # -- BFF container image registry and repository.
    # Format: <registry>/<org>/<image>.
    repository: quay.io/rh-ai-community-plugins/brewet-bff
    # -- BFF image tag override. When empty (""), defaults to appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # -- Number of BFF pod replicas. Must be a positive integer (>= 1).
  replicaCount: 1
  service:
    type: ClusterIP
    # -- BFF service port. Valid range: 1-65535.
    port: 3000
    # -- BFF container port. Valid range: 1-65535.
    targetPort: 3000
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Optional reference NetworkPolicy — restricts per-project storage backend
# ingress to the BFF namespace only. Deploy to each project namespace.
networkPolicy:
  enabled: false

# Storage backend image — used by the frontend when creating per-project containers.
# The tag should match the deployed plugin version.
storageBackend:
  image:
    # -- Storage backend container image registry and repository.
    # Format: <registry>/<org>/<image>.
    repository: quay.io/rh-ai-community-plugins/brewet-storage-backend
    # -- Storage backend image tag override. When empty (""), defaults to appVersion.
    tag: ""
    pullPolicy: IfNotPresent
