{{- if .Values.bff.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "brewet.bffFullname" . }}
  labels:
    {{- include "brewet.labels" . | nindent 4 }}
    app.kubernetes.io/component: bff
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "brewet.bffFullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "brewet.bffServiceAccountName" . }}
    namespace: {{ include "brewet.namespace" . }}
{{- end }}
