apiVersion: v1
kind: Service
metadata:
  name: {{ include "brewet.fullname" . }}
  namespace: {{ include "brewet.namespace" . }}
  labels:
    {{- include "brewet.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port | int }}
      targetPort: {{ .Values.service.targetPort | int }}
      protocol: TCP
      name: http
  selector:
    {{- include "brewet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
