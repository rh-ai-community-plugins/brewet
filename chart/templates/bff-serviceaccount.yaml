{{- if .Values.bff.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "brewet.fullname" . }}-bff
  labels:
    {{- include "brewet.labels" . | nindent 4 }}
    app.kubernetes.io/component: bff
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
