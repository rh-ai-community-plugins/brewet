# --- Plugin identity (required) ---
name: brewet                        # [PLUGIN-SPECIFIC] Module Federation remote name
displayName: Brewet                 # [PLUGIN-SPECIFIC] Human-readable name in dashboard sidebar
description: S3 and PVC storage management for Red Hat OpenShift AI — browse, upload, download, and transfer files across storage backends
version: 0.1.0                     # Managed by sync-chart-version.js — do not edit manually

# --- Maintainer (required) ---
maintainer:
  name: Your Name                   # [PLUGIN-SPECIFIC] Update with your name
  github: your-github-handle        # [PLUGIN-SPECIFIC] Update with your GitHub handle

# --- RHOAI compatibility (required) ---
rhoai_compatibility:
  min_version: "3.3.0"
  tested_versions: ["3.3.0", "3.4.2"]

# --- Deployment (required) ---
deployment_model: cluster-shared

image:
  repository: quay.io/OWNER/brewet              # [PLUGIN-SPECIFIC] Frontend container image
  tag: "0.1.0"                                  # Managed by sync-chart-version.js

bff_image:
  repository: quay.io/OWNER/brewet-bff          # [PLUGIN-SPECIFIC] BFF container image
  tag: "0.1.0"                                  # Managed by sync-chart-version.js

storage_backend_image:
  repository: quay.io/OWNER/brewet-storage-backend  # [PLUGIN-SPECIFIC] Storage backend container image
  tag: "0.1.0"                                      # Managed by sync-chart-version.js

# --- Installation (required) ---
install:
  method: automatic
  helm:
    chart_path: chart/
    registry: oci://quay.io/OWNER/brewet-chart   # [PLUGIN-SPECIFIC] Helm chart OCI registry
  prerequisites: []
  instructions: https://github.com/rh-ai-community-plugins/brewet/blob/main/docs/deployment  # [PLUGIN-SPECIFIC]

# --- Dashboard integration (required) ---
remote:
  type: module-federation
  spec:
    name: brewet                    # [PLUGIN-SPECIFIC] Must match webpack Module Federation name
    scope: brewet                   # [PLUGIN-SPECIFIC] Must match Module Federation scope
    # Update this URL to point to your deployed OpenShift route.
    remoteEntry: https://<your-openshift-route>/remoteEntry.js
    paths:
      - type: route
        path: /brewet               # [PLUGIN-SPECIFIC] Plugin route prefix
        extensions:
          - brewet/extensions        # [PLUGIN-SPECIFIC] Module Federation exposed module
      - type: icon
        path: brewet/Icon           # [PLUGIN-SPECIFIC] Module Federation exposed icon

# --- RBAC (required) ---
# The Helm chart creates a ClusterRole for the BFF ServiceAccount to get
# Services across namespaces (storage backend discovery). Users need RBAC
# permissions for create/list/delete on apps/deployments, core/services,
# networking.k8s.io/networkpolicies, and core/secrets via the dashboard's
# K8s API pass-through.
rbac:
  required_roles: []
  cluster_roles: true

# --- Support (optional) ---
support:
  repo: https://github.com/rh-ai-community-plugins/brewet       # [PLUGIN-SPECIFIC]
  docs: https://github.com/rh-ai-community-plugins/brewet/tree/main/docs  # [PLUGIN-SPECIFIC]
  issues: https://github.com/rh-ai-community-plugins/brewet/issues  # [PLUGIN-SPECIFIC]
