# --- Plugin identity (required) ---
name: brewet
displayName: Brewet
description: S3 and PVC storage management for Red Hat OpenShift AI — browse, upload, download, and transfer files across storage backends
version: 0.1.0

# --- Maintainer (required) ---
maintainer:
  name: Your Name
  github: your-github-handle

# --- RHOAI compatibility (required) ---
rhoai_compatibility:
  min_version: "3.3.0"
  tested_versions: ["3.3.0", "3.4.2"]

# --- Deployment (required) ---
deployment_model: cluster-shared

image:
  repository: quay.io/OWNER/brewet
  tag: "0.1.0"

bff_image:
  repository: quay.io/OWNER/brewet-bff
  tag: "0.1.0"

storage_backend_image:
  repository: quay.io/OWNER/brewet-storage-backend
  tag: "0.1.0"

# --- Installation (required) ---
install:
  method: automatic
  helm:
    chart_path: chart/
    registry: oci://quay.io/OWNER/brewet-chart
  prerequisites: []
  instructions: https://github.com/rh-ai-community-plugins/brewet/blob/main/docs/deployment

# --- Dashboard integration (required) ---
remote:
  type: module-federation
  spec:
    name: brewet
    scope: brewet
    # Update this URL to point to your deployed OpenShift route.
    remoteEntry: https://<your-openshift-route>/remoteEntry.js
    paths:
      - type: route
        path: /brewet
        extensions:
          - brewet/extensions
      - type: icon
        path: brewet/Icon

# --- RBAC (required) ---
# The Helm chart creates a ClusterRole for the BFF ServiceAccount to get
# Services across namespaces (storage backend discovery). Users need RBAC
# permissions for create/list/delete on apps/deployments, core/services,
# networking.k8s.io/networkpolicies, and core/secrets via the dashboard's
# K8s API pass-through.
rbac:
  required_roles: []
  cluster_roles: true

# --- Support (optional) ---
support:
  repo: https://github.com/rh-ai-community-plugins/brewet
  docs: https://github.com/rh-ai-community-plugins/brewet/tree/main/docs
  issues: https://github.com/rh-ai-community-plugins/brewet/issues
