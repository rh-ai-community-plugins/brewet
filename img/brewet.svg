<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 57 228 148" role="img" aria-label="Wheelbarrow">
  <!-- palette -->
  <!-- red #E8382C | dark red #C9271D | wood #E9B968 | wood shade #C68F3D | tire #5F7E86 | hub cap #9DB8BE -->

  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- tub -->
    <path d="M66 78 L188 78 L143 143 Q139 150 131 150 L123 150 Q115 150 111 143 Z" fill="#E8382C"/>
    <rect x="56" y="60" width="142" height="20" rx="10" fill="#C9271D"/>

    <!-- handle: shade then face -->
    <line x1="30" y1="95" x2="212" y2="174" stroke="#C68F3D" stroke-width="15"/>
    <line x1="30" y1="90" x2="212" y2="169" stroke="#E9B968" stroke-width="15"/>

    <!-- grip -->
    <line x1="26" y1="89" x2="50" y2="99" stroke="#C9271D" stroke-width="19"/>

    <!-- leg + brace -->
    <path d="M120 148 L112 190 L168 151" fill="none" stroke="#E8382C" stroke-width="13"/>
    <line x1="100" y1="191" x2="126" y2="191" stroke="#C9271D" stroke-width="13"/>

    <!-- wheel -->
    <circle cx="206" cy="168" r="34" fill="#5F7E86"/>
    <circle cx="206" cy="168" r="19" fill="#E8382C"/>
    <circle cx="206" cy="168" r="7" fill="#9DB8BE"/>

  </g>
</svg>
